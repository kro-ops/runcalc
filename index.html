<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Løpekalkulator</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3a0840">
  <meta name="description" content="Beregn fart, tempo og tid for løpeturer">
  <style>
    :root {
      --purple-900: #2d0830;
      --purple-700: #5b1a63;
      --purple-500: #8b3d96;
      --purple-200: #dbb8ff;
      --purple-100: #eddeff;
      --purple-50:  #f7f0ff;
      --text:       #1a0520;
      --muted:      #7a5c84;
      --border:     #e4cff0;
      --card:       #ffffff;
      --radius-sm:  10px;
      --radius-md:  16px;
      --radius-lg:  20px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--purple-50);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.25rem 1rem;
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }

    @media (min-width: 480px) {
      body { align-items: center; padding: 2rem; }
    }

    /* ── Card ──────────────────────────────────────────────────────────────── */

    .card {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 2px 8px rgba(45,8,48,0.06), 0 8px 40px rgba(45,8,48,0.10);
    }

    @media (min-width: 480px) {
      .card { padding: 2.25rem 2rem; }
    }

    /* ── Header ────────────────────────────────────────────────────────────── */

    .header {
      display: flex;
      align-items: flex-start;
      gap: 0.875rem;
      margin-bottom: 2rem;
    }

    .header-icon {
      width: 2.75rem;
      height: 2.75rem;
      background: linear-gradient(135deg, var(--purple-700), var(--purple-500));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.25rem;
    }

    .header-text h1 {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .header-text p {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.2rem;
    }

    /* ── Fields ────────────────────────────────────────────────────────────── */

    .fields {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
    }

    .calc-badge {
      display: none;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple-700);
      background: var(--purple-100);
      border-radius: var(--radius-pill);
      padding: 0.15rem 0.6rem;
    }

    .field.is-calculated .calc-badge { display: inline-flex; }

    /* ── Input row ─────────────────────────────────────────────────────────── */

    .input-row {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-row:focus-within {
      border-color: var(--purple-500);
      box-shadow: 0 0 0 3px rgba(139,61,150,0.12);
    }

    .input-row.calculated {
      background: var(--purple-50);
      border-color: var(--purple-200);
    }

    .input-row.calculated input { color: var(--purple-700); }

    input {
      flex: 1;
      border: none;
      outline: none;
      padding: 0.875rem 1rem;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }

    input::placeholder {
      color: #d4c0dc;
      font-weight: 400;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    /* Pace split */
    .pace-wrap {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .pace-wrap input { text-align: center; }

    #pace-min { flex: 0 0 3.5rem; padding-right: 0.25rem; }
    #pace-sec { flex: 0 0 3.5rem; padding-left: 0.25rem; }

    .pace-sep {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--muted);
      pointer-events: none;
      line-height: 1;
    }

    .calculated .pace-sep { color: var(--purple-500); }

    /* Time split */
    .time-wrap {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .time-wrap input { text-align: center; }

    #time-h   { flex: 0 0 2.5rem; padding-right: 0.25rem; }
    #time-min { flex: 0 0 3rem;   padding-left: 0.25rem; padding-right: 0.25rem; }
    #time-sec { flex: 0 0 3rem;   padding-left: 0.25rem; }

    .time-sep {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--muted);
      pointer-events: none;
      line-height: 1;
    }

    .calculated .time-sep { color: var(--purple-500); }

    .unit {
      padding: 0 1rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      border-left: 1.5px solid var(--border);
      height: 100%;
      display: flex;
      align-items: center;
    }

    .calculated .unit {
      border-left-color: var(--purple-200);
      color: var(--purple-500);
    }

    /* ── Distance preset pills ─────────────────────────────────────────────── */

    .preset-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.625rem;
      flex-wrap: wrap;
    }

    .preset-btn {
      flex: 1 1 auto;
      padding: 0.5rem 0.625rem;
      background: var(--purple-50);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      text-align: center;
    }

    .preset-btn:hover {
      background: var(--purple-100);
      border-color: var(--purple-200);
      color: var(--purple-700);
    }

    .preset-btn.active {
      background: var(--purple-700);
      border-color: var(--purple-700);
      color: #fff;
    }

    /* ── Reset button ──────────────────────────────────────────────────────── */

    .reset-btn {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.875rem;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      letter-spacing: 0.01em;
    }

    .reset-btn:hover, .reset-btn:active {
      background: var(--purple-50);
      border-color: var(--purple-200);
      color: var(--purple-700);
    }
  </style>
</head>
<body>

<div class="card">

  <div class="header">
    <div class="header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28">
        <g filter="url(#glow)" stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cx="45" cy="12" r="5.5" fill="white" stroke="none"/>
          <path d="M 43 18 C 41 25 38 31 34 38" stroke-width="3.8"/>
          <path d="M 39 23 C 33 20 27 18 22 17" stroke-width="3.1"/>
          <path d="M 40 25 C 45 31 49 37 51 42" stroke-width="3.1"/>
          <path d="M 35 38 C 29 45 24 51 19 58" stroke-width="3.8"/>
          <path d="M 34 38 C 41 44 47 49 53 53" stroke-width="3.8"/>
        </g>
      </svg>
    </div>
    <div class="header-text">
      <h1>Løpekalkulator</h1>
      <p>Fyll inn to felt — resten beregnes automatisk</p>
    </div>
  </div>

  <div class="fields">

    <div class="field" id="field-speed">
      <div class="field-label-row">
        <label>Fart</label>
        <span class="calc-badge">beregnet</span>
      </div>
      <div class="input-row" id="row-speed">
        <input type="number" id="speed" placeholder="10.0" min="0" step="0.1"
               inputmode="decimal" autocomplete="off">
        <span class="unit">km/t</span>
      </div>
    </div>

    <div class="field" id="field-pace">
      <div class="field-label-row">
        <label>Tempo</label>
        <span class="calc-badge">beregnet</span>
      </div>
      <div class="input-row" id="row-pace">
        <div class="pace-wrap">
          <input type="number" id="pace-min" placeholder="6" min="0" max="99"
                 inputmode="numeric" autocomplete="off">
          <span class="pace-sep">:</span>
          <input type="number" id="pace-sec" placeholder="00" min="0" max="59"
                 inputmode="numeric" autocomplete="off">
        </div>
        <span class="unit">min/km</span>
      </div>
    </div>

    <div class="field" id="field-distance">
      <div class="field-label-row">
        <label>Distanse</label>
        <span class="calc-badge">beregnet</span>
      </div>
      <div class="input-row" id="row-distance">
        <input type="number" id="distance" placeholder="10.0" min="0" step="0.1"
               inputmode="decimal" autocomplete="off">
        <span class="unit">km</span>
      </div>
      <div class="preset-row">
        <button class="preset-btn" data-km="5"        onclick="setPreset(this)">5 km</button>
        <button class="preset-btn" data-km="10"       onclick="setPreset(this)">10 km</button>
        <button class="preset-btn" data-km="21.0975"  onclick="setPreset(this)">Halvmaraton</button>
        <button class="preset-btn" data-km="42.195"   onclick="setPreset(this)">Maraton</button>
      </div>
    </div>

    <div class="field" id="field-time">
      <div class="field-label-row">
        <label>Total tid</label>
        <span class="calc-badge">beregnet</span>
      </div>
      <div class="input-row" id="row-time">
        <div class="time-wrap">
          <input type="number" id="time-h"   placeholder="0"  min="0" max="99"
                 inputmode="numeric" autocomplete="off">
          <span class="time-sep">:</span>
          <input type="number" id="time-min" placeholder="00" min="0" max="59"
                 inputmode="numeric" autocomplete="off">
          <span class="time-sep">:</span>
          <input type="number" id="time-sec" placeholder="00" min="0" max="59"
                 inputmode="numeric" autocomplete="off">
        </div>
        <span class="unit">t : min : sek</span>
      </div>
    </div>

  </div>

  <button class="reset-btn" onclick="resetAll()">Nullstill</button>

</div>

<script>
  const speedEl   = document.getElementById('speed');
  const paceMinEl = document.getElementById('pace-min');
  const paceSecEl = document.getElementById('pace-sec');
  const distEl    = document.getElementById('distance');
  const timeHEl   = document.getElementById('time-h');
  const timeMinEl = document.getElementById('time-min');
  const timeSecEl = document.getElementById('time-sec');

  let lastEdited   = null;
  let activePreset = null;

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function getPaceDecimal() {
    const m = parseInt(paceMinEl.value, 10);
    const s = parseInt(paceSecEl.value, 10);
    const minOk = !isNaN(m) && m >= 0;
    const secOk = !isNaN(s) && s >= 0 && s < 60;
    if (!minOk && !secOk) return NaN;
    return (minOk ? m : 0) + (secOk ? s : 0) / 60;
  }

  function setPaceFromDecimal(dec) {
    if (!isFinite(dec) || dec <= 0) { paceMinEl.value = ''; paceSecEl.value = ''; return; }
    const min = Math.floor(dec);
    let   sec = Math.round((dec - min) * 60);
    if (sec === 60) { paceMinEl.value = String(min + 1); paceSecEl.value = '00'; }
    else            { paceMinEl.value = String(min);     paceSecEl.value = String(sec).padStart(2, '0'); }
  }

  function getTimeDecimal() {
    const h   = parseInt(timeHEl.value,   10);
    const min = parseInt(timeMinEl.value, 10);
    const sec = parseInt(timeSecEl.value, 10);
    const hOk   = !isNaN(h)   && h   >= 0;
    const minOk = !isNaN(min) && min >= 0 && min < 60;
    const secOk = !isNaN(sec) && sec >= 0 && sec < 60;
    if (!hOk && !minOk && !secOk) return NaN;
    return (hOk ? h : 0) * 60 + (minOk ? min : 0) + (secOk ? sec : 0) / 60;
  }

  function setTimeFromDecimal(totalMin) {
    if (!isFinite(totalMin) || totalMin <= 0) {
      timeHEl.value = ''; timeMinEl.value = ''; timeSecEl.value = '';
      return;
    }
    const totalSec = Math.round(totalMin * 60);
    const ss = totalSec % 60;
    const mm = Math.floor(totalSec / 60) % 60;
    const hh = Math.floor(totalSec / 3600);
    timeHEl.value   = hh > 0 ? String(hh) : '';
    timeMinEl.value = String(mm).padStart(2, '0');
    timeSecEl.value = String(ss).padStart(2, '0');
  }

  function setCalculated(fieldId, isCalc) {
    const fn = isCalc ? 'add' : 'remove';
    document.getElementById('field-' + fieldId).classList[fn]('is-calculated');
    document.getElementById('row-'   + fieldId).classList[fn]('calculated');
  }

  function clearPresets() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    activePreset = null;
  }

  // ── Preset buttons ────────────────────────────────────────────────────────────

  function setPreset(btn) {
    const km = parseFloat(btn.dataset.km);
    distEl.value = km;
    clearPresets();
    btn.classList.add('active');
    activePreset = btn;
    lastEdited = 'distance';
    calculate();
  }

  // ── Core calculation ─────────────────────────────────────────────────────────
  //
  // Tre uavhengige størrelser: tempo/fart, distanse, totaltid.
  // To kjente → beregn den tredje.
  //
  // lastEdited = 'speed'    → konverter til tempo; beregn tid hvis dist kjent,
  //                           eller dist hvis tid kjent
  // lastEdited = 'pace'     → konverter til fart; beregn tid hvis dist kjent,
  //                           eller dist hvis tid kjent
  // lastEdited = 'distance' → beregn tid hvis tempo/fart kjent,
  //                           eller tempo/fart hvis tid kjent
  // lastEdited = 'time'     → beregn tempo/fart hvis dist kjent,
  //                           eller dist hvis tempo/fart kjent

  function calculate() {
    const speedRaw = parseFloat(speedEl.value);
    const paceRaw  = getPaceDecimal();
    const distRaw  = parseFloat(distEl.value);
    const timeRaw  = getTimeDecimal();

    const hasSpeed = !isNaN(speedRaw) && speedRaw > 0;
    const hasPace  = !isNaN(paceRaw)  && paceRaw  > 0;
    const hasDist  = !isNaN(distRaw)  && distRaw  > 0;
    const hasTime  = !isNaN(timeRaw)  && timeRaw  > 0;

    // Nullstill alle "beregnet"-markeringer
    setCalculated('speed',    false);
    setCalculated('pace',     false);
    setCalculated('distance', false);
    setCalculated('time',     false);

    if (lastEdited === 'speed') {
      if (hasSpeed) {
        setPaceFromDecimal(60 / speedRaw);
        setCalculated('pace', true);
        if (hasDist) {
          setTimeFromDecimal((60 / speedRaw) * distRaw);
          setCalculated('time', true);
        } else if (hasTime) {
          distEl.value = (timeRaw * speedRaw / 60).toFixed(2);
          setCalculated('distance', true);
        }
      } else {
        paceMinEl.value = ''; paceSecEl.value = '';
      }

    } else if (lastEdited === 'pace') {
      if (hasPace) {
        speedEl.value = (60 / paceRaw).toFixed(2);
        setCalculated('speed', true);
        if (hasDist) {
          setTimeFromDecimal(paceRaw * distRaw);
          setCalculated('time', true);
        } else if (hasTime) {
          distEl.value = (timeRaw / paceRaw).toFixed(2);
          setCalculated('distance', true);
        }
      } else {
        speedEl.value = '';
      }

    } else if (lastEdited === 'distance') {
      const pace = hasPace ? paceRaw : (hasSpeed ? 60 / speedRaw : NaN);
      if (isFinite(pace) && pace > 0 && hasDist) {
        setTimeFromDecimal(pace * distRaw);
        setCalculated('time', true);
        if (!hasPace) { setPaceFromDecimal(pace); setCalculated('pace', true); }
        if (!hasSpeed) { speedEl.value = (60 / pace).toFixed(2); setCalculated('speed', true); }
      } else if (hasTime && hasDist) {
        const newPace = timeRaw / distRaw;
        setPaceFromDecimal(newPace);
        setCalculated('pace', true);
        speedEl.value = (60 / newPace).toFixed(2);
        setCalculated('speed', true);
      }

    } else if (lastEdited === 'time') {
      if (hasTime && hasDist) {
        const newPace = timeRaw / distRaw;
        setPaceFromDecimal(newPace);
        setCalculated('pace', true);
        speedEl.value = (60 / newPace).toFixed(2);
        setCalculated('speed', true);
      } else if (hasTime && (hasPace || hasSpeed)) {
        const pace = hasPace ? paceRaw : 60 / speedRaw;
        distEl.value = (timeRaw / pace).toFixed(2);
        setCalculated('distance', true);
      }
    }
  }

  // ── Event listeners ──────────────────────────────────────────────────────────

  speedEl.addEventListener('input', () => { lastEdited = 'speed'; calculate(); });

  distEl.addEventListener('input', () => {
    lastEdited = 'distance';
    clearPresets();
    const v = parseFloat(distEl.value);
    document.querySelectorAll('.preset-btn').forEach(b => {
      if (Math.abs(parseFloat(b.dataset.km) - v) < 0.001) {
        b.classList.add('active');
        activePreset = b;
      }
    });
    calculate();
  });

  paceMinEl.addEventListener('input', () => {
    lastEdited = 'pace';
    if (paceMinEl.value.length >= 2) paceSecEl.focus();
    calculate();
  });

  paceSecEl.addEventListener('input', () => {
    lastEdited = 'pace';
    const v = parseInt(paceSecEl.value, 10);
    if (!isNaN(v) && v > 59) paceSecEl.value = '59';
    calculate();
  });

  paceSecEl.addEventListener('blur', () => {
    const v = parseInt(paceSecEl.value, 10);
    if (!isNaN(v)) paceSecEl.value = String(v).padStart(2, '0');
  });

  timeHEl.addEventListener('input', () => {
    lastEdited = 'time';
    calculate();
  });

  timeMinEl.addEventListener('input', () => {
    lastEdited = 'time';
    const v = parseInt(timeMinEl.value, 10);
    if (!isNaN(v) && v > 59) timeMinEl.value = '59';
    if (timeMinEl.value.length >= 2) timeSecEl.focus();
    calculate();
  });

  timeSecEl.addEventListener('input', () => {
    lastEdited = 'time';
    const v = parseInt(timeSecEl.value, 10);
    if (!isNaN(v) && v > 59) timeSecEl.value = '59';
    calculate();
  });

  timeMinEl.addEventListener('blur', () => {
    const v = parseInt(timeMinEl.value, 10);
    if (!isNaN(v)) timeMinEl.value = String(v).padStart(2, '0');
  });

  timeSecEl.addEventListener('blur', () => {
    const v = parseInt(timeSecEl.value, 10);
    if (!isNaN(v)) timeSecEl.value = String(v).padStart(2, '0');
  });

  // ── Reset ────────────────────────────────────────────────────────────────────

  function resetAll() {
    speedEl.value   = '';
    paceMinEl.value = '';
    paceSecEl.value = '';
    distEl.value    = '';
    timeHEl.value   = '';
    timeMinEl.value = '';
    timeSecEl.value = '';
    lastEdited = null;
    clearPresets();
    ['speed', 'pace', 'distance', 'time'].forEach(id => setCalculated(id, false));
  }
</script>

</body>
</html>
